networks:
  app-network:

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - app-network

  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=smart-contracts'
      - 'POSTGRES_PASSWORD=admin'
      - 'POSTGRES_USER=admin'
    ports:
      - '5432:5433'
    networks:
      - app-network
  ganache:
    image: trufflesuite/ganache
    ports:
      - "8545:8545"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"

    depends_on:
      - app

    networks:
      - app-network
